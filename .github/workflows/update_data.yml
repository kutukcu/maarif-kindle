name: Update Daily Data

on:
  schedule:
    # Her saat başı
    - cron: '0 * * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          git diff --staged --quiet \
            || git commit -m "chore: daily data $(date -u +%Y-%m-%d)"
          git push

  # ── Deploy data/ to GitHub Pages so the Kindle plugin can fetch it ──────
  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # fetch the just-committed state

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/   # publish only the data/ folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
